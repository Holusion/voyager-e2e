name: End-to-end tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Voyager's branches move independently of this repository.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Voyager ${{ matrix.voyager }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Holusion's fork: shared and fork-specific behavior.
          - voyager: master
            args: --project core --project fork --grep-invert @pending
          # Upstream, as tracked by the fork: shared behavior only.
          - voyager: upstream
            args: --project core --grep-invert @pending
    env:
      VOYAGER_DIST: .voyager/${{ matrix.voyager }}/dist
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Build Voyager ${{ matrix.voyager }}
        run: scripts/build-voyager.sh https://github.com/Holusion/dpo-voyager ${{ matrix.voyager }} .voyager/${{ matrix.voyager }}

      - name: Record the tested revision
        run: echo "Voyager \`${{ matrix.voyager }}\` at $(git -C .voyager/${{ matrix.voyager }} rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - run: npx playwright test ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.voyager }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Tests tagged @pending:<change> cover a Voyager change not merged yet. They run against the change,
  # where they must pass, and against its base, where they must fail. Once the change is merged,
  # they pass there too: the base job fails until their tag and the change's entries are removed.
  pending:
    name: Pending ${{ matrix.change }} (${{ matrix.build }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stream audio from its URL instead of downloading and decoding every clip on load.
          - change: audio-durations
            build: change
            ref: audio-durations
            args: --project core
          - change: audio-durations
            build: base
            ref: upstream
            args: --project core
    env:
      VOYAGER_DIST: .voyager/${{ matrix.build }}/dist
      VOYAGER_UNMERGED: ${{ matrix.build == 'base' && format('@pending:{0}', matrix.change) || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Build Voyager ${{ matrix.ref }}
        id: build
        run: scripts/build-voyager.sh https://github.com/Holusion/dpo-voyager ${{ matrix.ref }} .voyager/${{ matrix.build }}

      - name: Record the tested revision
        run: echo "Voyager \`${{ matrix.ref }}\` (${{ matrix.build }} of ${{ matrix.change }}) at $(git -C .voyager/${{ matrix.build }} rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Tests of ${{ matrix.change }}
        run: npx playwright test ${{ matrix.args }} --grep @pending:${{ matrix.change }}

      # The change must not break what already works.
      - name: Other tests
        if: matrix.build == 'change' && !cancelled() && steps.build.outcome == 'success'
        run: npx playwright test ${{ matrix.args }} --grep-invert @pending --output test-results/others
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/others

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-pending-${{ matrix.change }}-${{ matrix.build }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
